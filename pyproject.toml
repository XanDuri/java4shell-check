[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "java4shell-check"
version = "0.1.0"
description = "Check if a host is affected by Java4Shell (CVE-2026-114938) — read-only, no exploit code."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Łukasz Moszczyński" }]
requires-python = ">=3.11"
dependencies = ["rich>=13", "py-cpuinfo>=9", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
java4shell-check = "java4shell_check.cli:main"

[tool.setuptools.packages.find]
include = ["java4shell_check*"]

[tool.setuptools.package-data]
java4shell_check = ["data/*.json"]
